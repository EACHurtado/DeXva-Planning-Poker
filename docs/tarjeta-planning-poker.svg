<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <radialGradient id="brillo" cx="0.5" cy="0.62" r="0.6">
      <stop offset="0" stop-color="#43ded0" stop-opacity="0.22" />
      <stop offset="1" stop-color="#43ded0" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="brillo-oro" cx="0.08" cy="0.05" r="0.5">
      <stop offset="0" stop-color="#d9b25f" stop-opacity="0.14" />
      <stop offset="1" stop-color="#d9b25f" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cian" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22e3f2" />
      <stop offset="1" stop-color="#0a7fb5" />
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b8862c" />
      <stop offset="1" stop-color="#f0c860" />
    </linearGradient>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#081820" />
  <rect width="1200" height="675" fill="url(#brillo)" />
  <rect width="1200" height="675" fill="url(#brillo-oro)" />

  <!-- Marca -->
  <g transform="translate(64 60)">
    <text x="0" y="40" font-size="46" font-weight="700" letter-spacing="-2" fill="#f6f6f0">De</text>
    <g transform="translate(58 2) scale(0.6)">
      <polygon points="66,0 96,0 34,72 4,72" fill="url(#oro)" />
      <polygon points="4,0 34,0 96,72 66,72" fill="url(#cian)" stroke="#081820" stroke-width="5" />
    </g>
    <text x="116" y="40" font-size="46" font-weight="700" letter-spacing="-2" fill="#f6f6f0">va</text>
    <text x="2" y="68" font-size="13" letter-spacing="6" fill="#d9b25f">PLANNING POKER</text>
  </g>

  <!-- Abanico de cartas: giran alrededor de un punto bajo el lienzo -->
  <g filter="url(#sombra)" font-weight="700" text-anchor="middle" transform="translate(0 -78)">
    <g transform="rotate(-28 600 1050)">
      <rect x="505" y="250" width="190" height="270" rx="14" fill="#0d232e" stroke="#2b4a58" stroke-width="2" />
      <text x="600" y="412" font-size="92" fill="#f6f6f0">3</text>
    </g>
    <g transform="rotate(-14 600 1050)">
      <rect x="505" y="250" width="190" height="270" rx="14" fill="#0d232e" stroke="#2b4a58" stroke-width="2" />
      <text x="600" y="412" font-size="92" fill="#f6f6f0">5</text>
    </g>
    <g transform="rotate(28 600 1050)">
      <rect x="505" y="250" width="190" height="270" rx="14" fill="#0d232e" stroke="#2b4a58" stroke-width="2" />
      <text x="600" y="412" font-size="92" fill="#f6f6f0">21</text>
    </g>
    <g transform="rotate(14 600 1050)">
      <rect x="505" y="250" width="190" height="270" rx="14" fill="#12303d" stroke="#d9b25f" stroke-width="3" />
      <text x="600" y="412" font-size="92" fill="#f6f6f0">13</text>
    </g>
    <g transform="translate(0 -26)">
      <rect x="505" y="250" width="190" height="270" rx="14" fill="url(#cian)" />
      <text x="600" y="416" font-size="104" fill="#081820">8</text>
    </g>
  </g>

  <text x="600" y="628" text-anchor="middle" font-size="26" fill="#9db2b6">Que la estimación sea un acuerdo de equipo</text>
</svg>
